parameters:
    # No .env file: APP_SECRET comes from the real environment, with a default for local use.
    env(APP_SECRET): 'local-dev-secret-change-me'
    # Default input (used when no payload / file arguments are given, and overwritten by PUT /api/data).
    # The folder can be changed with APP_DATA_DIR; the tests point it at a temporary folder.
    env(APP_DATA_DIR): '%kernel.project_dir%/data'
    app.employees_file: '%env(APP_DATA_DIR)%/employees.json'
    app.tasks_file: '%env(APP_DATA_DIR)%/tasks.json'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $defaultEmployeesFile: '%app.employees_file%'
            string $defaultTasksFile: '%app.tasks_file%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Domain/'

when@test:
    services:
        # No logging bundle installed: keep the kernel's default stderr logger quiet in tests.
        logger:
            class: Psr\Log\NullLogger
